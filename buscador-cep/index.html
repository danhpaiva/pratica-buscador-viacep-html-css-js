<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buscador de CEP - ViaCEP</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="container">
        <h1>Buscador de Endereço</h1>
        <p>Consulte dados em tempo real utilizando a API do ViaCEP e CI/CD.</p>

        <div class="form-group">
            <label for="cep">Digite o CEP (somente números):</label>
            <div class="input-row">
                <input type="text" id="cep" placeholder="Ex: 01001000" maxlength="8">
                <button onclick="consultarCep()">Buscar</button>
            </div>
        </div>

        <div class="resultado-box">
            <div class="field">
                <label>Logradouro:</label>
                <input type="text" id="logradouro" readonly placeholder="-">
            </div>
            <div class="field">
                <label>Bairro:</label>
                <input type="text" id="bairro" readonly placeholder="-">
            </div>
            <div class="field">
                <label>Cidade:</label>
                <input type="text" id="cidade" readonly placeholder="-">
            </div>
            <div class="field">
                <label>Estado (UF):</label>
                <input type="text" id="estado" readonly placeholder="-">
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
